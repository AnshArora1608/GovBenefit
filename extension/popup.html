<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GovBenefit Form Mentor</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafd;
      color: #14213d;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid #e8871e;
      padding-bottom: 8px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .status-badge {
      display: inline-block;
      background: #dff3e8;
      color: #1f7a4d;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .profile-card {
      background: #fff;
      border: 1px solid #d9dfe9;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .profile-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #5b6678;
      margin-bottom: 4px;
    }
    .profile-name {
      font-size: 13px;
      font-weight: 700;
      color: #14213d;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #14213d;
      color: #fff;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 6px;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #002244;
    }
    .btn-secondary {
      background: #fff;
      color: #14213d;
      border: 1px solid #d9dfe9;
    }
    .btn-secondary:hover {
      background: #f1f4f9;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🏛️</span>
    <h2>GovBenefit Mentor</h2>
  </div>

  <div class="status-badge" id="statusBadge">● Ready & Connected</div>

  <div class="profile-card">
    <div class="profile-title">Active Citizen Profile</div>
    <div class="profile-name" id="profileName">Loading profile...</div>
    <div style="font-size: 11px; color: #5b6678;" id="profileMeta">-</div>
  </div>

  <a href="http://localhost:8000/government-portal/pmegp-application" target="_blank" class="btn">
    📝 Open PMEGP Application Form
  </a>

  <a href="http://localhost:8000/profile" target="_blank" class="btn btn-secondary">
    👤 Edit GovBenefit Profile
  </a>

  <script src="popup.js"></script>
</body>
</html>
